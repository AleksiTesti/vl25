<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Korttipeli</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-header">
  <a href="/" class="card-button">🂠 Etusivu</a>
  <h1>Korttipeli</h1>
</header>

<main class="card-game">

  <img
    id="cardImage"
    class="card-image"
    src="cards/ETUKANSI.png"
    alt="Kortti"
  >

  <div id="endScreen" class="end-screen">
    <h2>Pakka pelattu 🎉</h2>
    <button class="button" onclick="resetDeck()">Sekoita & aloita alusta</button>
  </div>

</main>

<script>
  const frontCard = "cards/ETUKANSI.png";

  const cards = [
    "cards/kortti-01.png",
    "cards/kortti-02.png",
    "cards/kortti-03.png",
    "cards/kortti-04.png",
    "cards/kortti-05.png",
    "cards/kortti-06.png",
    "cards/kortti-07.png",
    "cards/kortti-08.png",
    "cards/kortti-09.png",
    "cards/kortti-10.png",
    "cards/kortti-11.png",
    "cards/kortti-12.png",
    "cards/kortti-13.png",
    "cards/kortti-14.png",
    "cards/kortti-15.png",
    "cards/kortti-16.png",
    "cards/kortti-17.png",
    "cards/kortti-18.png",
    "cards/kortti-19.png",
    "cards/kortti-20.png",
    "cards/kortti-21.png",
    "cards/kortti-22.png",
    "cards/kortti-23.png",
    "cards/kortti-24.png",
    "cards/kortti-25.png",
    "cards/kortti-26.png",
    "cards/kortti-27.png",
    "cards/kortti-28.png",
    "cards/kortti-29.png",
    "cards/kortti-30.png",
    "cards/kortti-31.png",
    "cards/kortti-32.png",
    "cards/kortti-33.png",
    "cards/kortti-34.png",

    "cards/kortti-36.png",
    "cards/kortti-37.png",

    "cards/kortti-45.png",

    "cards/kortti-59.png",
    "cards/kortti-60.png",
    "cards/kortti-61.png",
    "cards/kortti-62.png"
  ];

  let deck = [];
  let index = -1;
  let gameOver = false;

  function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
  }

  function startGame() {
    deck = shuffle([...cards]);
    index = -1;
    gameOver = false;

    document.getElementById("cardImage").src = frontCard;
    document.getElementById("cardImage").style.display = "block";
    document.getElementById("endScreen").style.display = "none";
  }

  function nextCard() {
    if (gameOver) return;

    index++;
    if (index < deck.length) {
      document.getElementById("cardImage").src = deck[index];
    } else {
      gameOver = true;
      document.getElementById("cardImage").style.display = "none";
      document.getElementById("endScreen").style.display = "block";
    }
  }

  function resetDeck() {
    startGame();
  }

  document.getElementById("cardImage").addEventListener("click", nextCard);

  startGame();
</script>

</body>
</html>
