<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Korttipeli</title>
  <link rel="stylesheet" href="/styles.css">

  <style>
    .card-game {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 2em;
    }

    .card-game img {
      width: 85%;
      max-width: 320px;
      border-radius: 12px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    .deck-finished {
      font-size: 1.2em;
      margin: 2em;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .card-game img {
        width: 95%;
      }
    }
  </style>
</head>

<body>

<!-- 🔵 SININEN YLÄPALKKI -->
<header class="top-header">
  <a href="/" class="card-button">← Etusivulle</a>
  <h1>Korttipeli</h1>
</header>

<main class="card-game">

  <!-- Korttikuva -->
  <img id="cardImage" src="cards/ETUKANSI.png" alt="Kortti" onclick="nextCard()">

  <!-- Teksti kun pakka loppu -->
  <div id="deckFinished" class="deck-finished" style="display:none;">
    Pakka on pelattu 🎉  
    <br><br>
    <button class="button" onclick="resetDeck()">Sekoita uudelleen</button>
  </div>

</main>

<script>
  const frontCard = "cards/ETUKANSI.png";

  const cards = [
    "cards/kortti-01.png",
    "cards/kortti-02.png",
    "cards/kortti-03.png",
    "cards/kortti-04.png",
    "cards/kortti-05.png",
    // ... jatka listaa
  ];

  let deck = [];
  let index = -1;

  function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
  }

  function startGame() {
    deck = shuffle([...cards]);
    index = -1;
    document.getElementById("cardImage").src = frontCard;
    document.getElementById("cardImage").style.display = "block";
    document.getElementById("deckFinished").style.display = "none";
  }

  function nextCard() {
    index++;
    if (index < deck.length) {
      document.getElementById("cardImage").src = deck[index];
    } else {
      document.getElementById("cardImage").style.display = "none";
      document.getElementById("deckFinished").style.display = "block";
    }
  }

  function resetDeck() {
    startGame();
  }

  startGame();
</script>

</body>
</html>
