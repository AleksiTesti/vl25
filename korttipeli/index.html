<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Korttipeli</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-header">
  <a href="/" class="card-button">Etusivu</a>
  <h1>Korttipeli</h1>
</header>

<main class="card-game">

  <img
    id="cardImage"
    class="card-image"
    src="cards/ETUKANSI.png"
    alt="Kortti"
  >

  <div id="endScreen" class="end-screen">
    <h2>Pakka pelattu 🎉</h2>
    <button class="button" onclick="resetDeck()">Sekoita & aloita alusta</button>
  </div>

</main>

<script>
  const frontCard = "cards/ETUKANSI.png";
  const totalCards = 62;

  const cards = Array.from({ length: totalCards }, (_, i) =>
    `cards/kortti-${String(i + 1).padStart(2, "0")}.png`
  );

  let deck = [];
  let index = -1;
  let gameOver = false;

  function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
  }

  function startGame() {
    deck = shuffle([...cards]);
    index = -1;
    gameOver = false;

    document.getElementById("cardImage").src = frontCard;
    document.getElementById("cardImage").style.display = "block";
    document.getElementById("endScreen").style.display = "none";
  }

  function nextCard() {
    if (gameOver) return;

    index++;
    if (index < deck.length) {
      document.getElementById("cardImage").src = deck[index];
    } else {
      gameOver = true;
      document.getElementById("cardImage").style.display = "none";
      document.getElementById("endScreen").style.display = "block";
    }
  }

  function resetDeck() {
    startGame();
  }

  document.getElementById("cardImage").addEventListener("click", nextCard);

  startGame();
</script>

</body>
</html>
